<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>طراحی سایت قالب فروشگاهی</title>
    <link rel="stylesheet" href="./asset/css/fonts.css" />
    <link rel="stylesheet" href="./asset/css/style.css" />
  </head>
  <body dir="rtl">
    <div class="container">
      <div class="form">
        <h2>ثبت فرم</h2>

        <form action="">
          <label for="name">نام</label>
          <input class="form-control" id="name" type="text" name="name" placeholder="نام خود را وارد کنید" />

          <label for="email">ایمیل</label>
          <input class="form-control" id="email" type="email" name="email" placeholder="ایمیل خود را وارد کنید" />

          <label for="password">رمز عبور</label>
          <input class="form-control" id="password" type="password" name="password" placeholder="رمز عبور خود را وارد کنید" />

          <label for="confirm-password">تکرار رمز عبور</label>
          <input class="form-control" id="confirm-password" type="password" name="confirm-password" placeholder="تکرار رمز عبور" />
          
          <label for="rules" class="checkbox">
            <input type="checkbox" name="rules" id="rules" />با قوانین موافقم
            <span class="checkmark"></span>
          </label>

          <button type="submit">ارسال</button>
        </form>
      </div>
    </div>
  </body>
</html>
